name: release

# 推一個 v* 的 tag 就自動編譯、簽章、發布到 GitHub Releases,
# 並產生 latest.json 供 App 自動更新偵測。
#
# 也可以手動觸發(Actions → release → Run workflow),
# 只更新某個既有 release 的說明文字 —— 改錯字不必重新編譯 15 分鐘。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要更新 Release 說明的 tag(例如 v0.2.2)"
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 手動觸發時:只覆寫 Release 說明就結束,不重編、不重簽、不動 assets
      - name: 只更新 Release 說明
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.event.inputs.tag }}" --notes-file RELEASE_NOTES.md
          Write-Host "已更新 ${{ github.event.inputs.tag }} 的說明"

      - name: Setup Node
        if: github.event_name != 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        if: github.event_name != 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: github.event_name != 'workflow_dispatch'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        if: github.event_name != 'workflow_dispatch'
        run: npm ci

      # 版本號三處必須一致,且要跟推上來的 tag 對得起來。
      # 不一致就當場失敗 —— 免得上線後 App 的更新比對基準(tauri.conf.json)是錯的。
      - name: 檢查版本號一致性
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $pkg     = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri   = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo   = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag     = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "package.json = $pkg"
          Write-Host "tauri.conf   = $tauri"
          Write-Host "Cargo.toml   = $cargo"
          Write-Host "tag          = $tag"
          if ($pkg -ne $tauri -or $tauri -ne $cargo) {
            throw "版本號不一致:package.json=$pkg, tauri.conf.json=$tauri, Cargo.toml=$cargo"
          }
          if ($tag -ne $tauri) {
            throw "tag ($tag) 與版本號 ($tauri) 不符 —— 請確認推的是 v$tauri"
          }
          Write-Host "✅ 版本號一致:$tauri"

      # 打包前檢查:public/ 底下「必須隨安裝包散布」的資產是否齊全。
      # v0.2.0 就是少了這些,CI 編出 4.3MB 的安裝檔(正常應為 23.9MB),
      # 使用者裝完「可以開但沒有角色」。寧可讓建置失敗,也不要再發布半殘的安裝檔。
      - name: 檢查打包資產是否齊全
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $required = @(
            "public/vendor/live2dcubismcore.min.js",
            "public/models/characters.json",
            "public/models/haru/haru_greeter_t03.model3.json",
            "public/models/haru/haru_greeter_t03.moc3",
            "public/models/haru/haru_greeter_t03.2048/texture_00.png"
          )
          $missing = @()
          foreach ($f in $required) {
            if (Test-Path $f) {
              Write-Host ("OK      {0}  ({1:N1} KB)" -f $f, ((Get-Item $f).Length / 1KB))
            } else {
              Write-Host ("MISSING {0}" -f $f)
              $missing += $f
            }
          }
          $pubMB = [math]::Round(((Get-ChildItem public -Recurse -File -ErrorAction SilentlyContinue |
                     Measure-Object Length -Sum).Sum / 1MB), 2)
          Write-Host "public/ 總大小:$pubMB MB"
          if ($missing.Count -gt 0) {
            throw "缺少打包資產:$($missing -join ', ') —— 安裝檔會沒有角色。請確認 public/models/haru 與 public/vendor 已入版控。"
          }
          if ($pubMB -lt 3) {
            throw "public/ 只有 $pubMB MB,明顯缺檔(正常約 3.2 MB:Haru 模型 + Cubism Core)。"
          }
          Write-Host "✅ 打包資產齊全"

      # 把 RELEASE_NOTES.md 讀進 step output。
      # 注意兩點:
      #  1. tauri-action 的 releaseBody 不會把 "./檔名" 當成檔案路徑讀
      #     (v0.2.0 實測會原樣變成字面上的 "./RELEASE_NOTES.md"),所以要自己讀。
      #  2. GITHUB_OUTPUT 不接受 BOM,也不能用 Out-File -Encoding utf8(會加 BOM),
      #     所以這裡用 .NET 明確寫「無 BOM 的 UTF-8」。
      - name: 讀取 Release Notes
        if: github.event_name != 'workflow_dispatch'
        id: notes
        shell: pwsh
        run: |
          $text = (Get-Content RELEASE_NOTES.md -Raw) -replace "`r`n", "`n"
          $utf8 = [System.Text.UTF8Encoding]::new($false)   # false = 不加 BOM
          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.Append("body<<__NOTES_EOF__`n")
          [void]$sb.Append($text)
          [void]$sb.Append("`n__NOTES_EOF__`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, $sb.ToString(), $utf8)
          Write-Host "Release notes 長度: $($text.Length) 字元"

      - name: Build, sign & publish
        if: github.event_name != 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Desktop Pet AI ${{ github.ref_name }}"
          # 更新說明取自上面讀進來的 RELEASE_NOTES.md,改文案不用動 workflow
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      # 保險:tauri-action 發布後再把說明覆寫一次。
      # 這樣即使 releaseBody 沒吃到多行 output,Release 頁上的說明仍然是正確的。
      - name: 確保 Release 說明正確
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
          Write-Host "✅ Release 說明已更新自 RELEASE_NOTES.md"
