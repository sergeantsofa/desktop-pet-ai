name: release

# 推一個 v* 的 tag 就自動編譯、簽章、發布到 GitHub Releases,
# 並產生 latest.json 供 App 自動更新偵測。
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # 版本號三處必須一致,且要跟推上來的 tag 對得起來。
      # 不一致就當場失敗 —— 免得上線後 App 的更新比對基準(tauri.conf.json)是錯的。
      - name: 檢查版本號一致性
        shell: pwsh
        run: |
          $pkg     = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri   = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo   = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag     = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "package.json = $pkg"
          Write-Host "tauri.conf   = $tauri"
          Write-Host "Cargo.toml   = $cargo"
          Write-Host "tag          = $tag"
          if ($pkg -ne $tauri -or $tauri -ne $cargo) {
            throw "版本號不一致:package.json=$pkg, tauri.conf.json=$tauri, Cargo.toml=$cargo"
          }
          if ($tag -ne $tauri) {
            throw "tag ($tag) 與版本號 ($tauri) 不符 —— 請確認推的是 v$tauri"
          }
          Write-Host "✅ 版本號一致:$tauri"

      - name: Build, sign & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Desktop Pet AI ${{ github.ref_name }}"
          # 更新說明直接讀專案內的 RELEASE_NOTES.md,改文案不用動 workflow
          releaseBody: "./RELEASE_NOTES.md"
          releaseDraft: false
          prerelease: false
